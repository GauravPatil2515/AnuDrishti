# Optimized Training Configuration for Tox21
# Target: ROC-AUC >= 0.82
# Device: RTX 3050 (6GB VRAM)

# Model Architecture
model:
  num_layer: 5
  emb_dim: 300
  feat_dim: 512
  drop_ratio: 0.2          # Reduced dropout for better learning
  pred_n_layer: 2
  pred_act: softplus

# Training Parameters - Optimized for higher ROC-AUC
training:
  batch_size: 32           # Smaller for RTX 3050
  epochs: 150              # More epochs for better convergence
  learning_rate: 0.0001    # Base encoder LR
  attention_lr: 0.0005     # Higher LR for attention layer
  weight_decay: 1e-6
  patience: 25             # More patience for convergence
  min_delta: 0.0001
  grad_clip: 1.0
  warmup_epochs: 5         # LR warmup
  
# Transfer Learning
transfer:
  freeze_encoder: false
  freeze_epochs: 0
  pretrained_path: null
  load_prediction_head: false

# Data
data:
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  scaffold_split: true      # Harder but more realistic split
  random_seed: 42

# Logging
logging:
  log_interval: 50
  save_attention_maps: true
  tensorboard: true

# Additional Optimizations
optimization:
  use_class_weights: true   # Handle class imbalance
  label_smoothing: 0.05     # Regularization
  mixup_alpha: 0.0          # Disabled for molecular data
