name: DeNovo CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-node: '3.10'

    - name: Install Core Dependencies
      run: |
        python -m pip install --upgrade pip
        # Install only core dependencies required for mock tests to avoid long install times
        pip install numpy pytest python-dotenv

    - name: Run Faithfulness Core Unit Tests
      run: |
        python -m unittest tests/test_faithfulness.py
