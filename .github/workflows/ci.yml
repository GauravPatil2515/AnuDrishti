name: AnuDrishti / PharmaGuard AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    name: Fast Backend CI & Smoke Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: 'backend/requirements.txt'

    - name: Cache Pip Wheels
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-v2-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-v2-

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install torch==2.4.0 --index-url https://download.pytorch.org/whl/cpu
        pip install rdkit numpy pandas scikit-learn xgboost flask flask-cors gunicorn groq python-dotenv pytest
        if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

    - name: Verify Backend Compiles
      run: |
        python -m py_compile backend/app.py backend/routes/pharmaguard.py backend/services/nl_query.py backend/models/ddi_predictor.py

    - name: Run Backend Unit Tests (Non-Integration)
      env:
        PYTHONPATH: backend
      run: |
        if [ -d tests ]; then python -m pytest tests/ -v --tb=short -k "not integration"; fi

    - name: Launch Backend Server & Run Integration Tests
      env:
        PYTHONPATH: backend
      run: |
        python backend/app.py &
        SERVER_PID=$!
        sleep 4
        
        # Health check
        curl -f http://localhost:5000/api/health || curl -f http://localhost:5000/ || true
        
        # Run integration tests
        if [ -f tests/integration_test.py ]; then python -m pytest tests/integration_test.py -v --tb=short; fi
        
        kill $SERVER_PID || true

  test-frontend:
    name: Fast Frontend CI & Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci || npm install --prefer-offline

    - name: Build Frontend (Production)
      run: |
        cd frontend
        CI=true npm run build

    - name: Run Frontend Tests
      run: |
        cd frontend
        npm test -- --watchAll=false --passWithNoTests