name: AnuDrishti / PharmaGuard AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    name: Backend CI & Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install rdkit numpy pandas scikit-learn xgboost flask flask-cors gunicorn groq python-dotenv pytest
        if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

    - name: Verify Backend Compiles
      run: |
        python -m py_compile backend/app.py backend/routes/pharmaguard.py

    - name: Run Backend Tests
      env:
        PYTHONPATH: .
      run: |
        if [ -d tests ]; then python -m pytest tests/ -v --tb=short; fi

  test-frontend:
    name: Frontend CI & Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci || npm install

    - name: Build Frontend (Production)
      run: |
        cd frontend
        CI=true npm run build

    - name: Run Frontend Tests
      run: |
        cd frontend
        npm test -- --watchAll=false --passWithNoTests

  integration-smoke-test:
    name: Integration Smoke Test
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install rdkit numpy pandas scikit-learn xgboost flask flask-cors gunicorn python-dotenv

    - name: Launch Backend Server & Test Health Endpoint
      run: |
        python backend/app.py &
        sleep 5
        curl -f http://localhost:5000/api/health || curl -f http://localhost:5000/
        pkill -f "python backend/app.py" || true