name: DeNovo CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Core Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy pytest python-dotenv

    - name: Run Python Unit & Integration Tests
      run: |
        python -m pytest tests/ -v --tb=short

    - name: Verify Backend Compiles
      run: |
        python -m py_compile backend/app.py backend/routes/pharmaguard.py backend/routes/__init__.py

  frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm install

    - name: Build Frontend
      run: |
        cd frontend
        npm run build
