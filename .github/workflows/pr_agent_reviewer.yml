name: PR Automated Reviewer & Integrity Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read
  issues: write

jobs:
  pr-review-and-triage:
    name: PR Automated Review & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Analyze PR Metadata & Post Welcome Checklist
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const isFirstContribution = context.payload.action === 'opened';
            
            if (isFirstContribution) {
              const welcomeMessage = [
                `### 🧬 Thank you @${author} for contributing to AnuDrishti!`,
                '',
                'Welcome to the AnuDrishti (PharmaGuard AI) open-source community. Our automated scientific & code quality review pipeline has been triggered.',
                '',
                '**Automated PR Checklist:**',
                '- [x] PR Received & Enqueued for Automated CI',
                '- [ ] PyTest Test Suite Execution',
                '- [ ] Scientific Citation & Formula Validation',
                '- [ ] 21 CFR Part 11 Audit Trail Integrity Check',
                '',
                'Maintainers will review your pull request shortly. For major scientific changes, please ensure literature references are provided.'
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: welcomeMessage
              });
            }
